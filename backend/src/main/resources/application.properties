spring.application.name=directme-film-api

# H2 keeps first-run setup friction low. Set the three DATABASE_* variables to use PostgreSQL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:directmefilm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
